name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar a pasta android
        run: |
          flutter create --org com.gabestk --project-name manuook --platforms=android .
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          sed -i 's#android:label="[^"]*"#android:label="manuook"#' "$MANIFEST"
          grep -n 'INTERNET\|label' "$MANIFEST"

      - run: flutter pub get

      - name: Testes
        run: flutter test

      - name: Ícone do app
        run: dart run flutter_launcher_icons

      - name: Compilar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Assinar com a chave fixa do manuook
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks keystore/manuook.jks \
            --ks-pass pass:manuook --ks-key-alias manuook --key-pass pass:manuook \
            --out manuook.apk build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify manuook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: manuook-apk
          path: manuook.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: manuook 1.0.${{ github.run_number }}
          files: manuook.apk
          body: APK gerado automaticamente a partir do commit ${{ github.sha }}.
