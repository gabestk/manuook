name: Build Android e iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar a pasta android
        run: |
          flutter create --org com.gabestk --project-name manuook --platforms=android .
          rm -f test/widget_test.dart
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          sed -i 's#android:label="[^"]*"#android:label="Manuook"#' "$MANIFEST"
          grep -n 'INTERNET\|label' "$MANIFEST"

      - run: flutter pub get

      - name: Analisar código
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || {
            grep -E "error" analyze.txt | sed 's/^/::error::/' ; exit 1; }

      - name: Testes
        run: flutter test

      - name: Ícone do app
        run: dart run flutter_launcher_icons

      - name: Compilar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Assinar com a chave fixa do manuook
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks keystore/manuook.jks \
            --ks-pass pass:manuook --ks-key-alias manuook --key-pass pass:manuook \
            --out manuook.apk build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify manuook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: manuook-apk
          path: manuook.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar a pasta ios
        run: |
          flutter create --org com.gabestk --project-name manuook --platforms=ios .
          rm -f test/widget_test.dart
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Manuook" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Manuook" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Manuook" "$PLIST"
          # iOS 13 ou superior (iPhone 6s em diante, incluindo o iPhone 11)
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^# *platform :ios.*/platform :ios, '13.0'/" ios/Podfile
            grep -n "platform :ios" ios/Podfile || true
          fi
          # Ícone também no iOS
          python3 - <<'PY'
          s = open('pubspec.yaml').read()
          s = s.replace('  android: true', '  android: false').replace('  ios: false', '  ios: true\n  remove_alpha_ios: true')
          open('pubspec.yaml', 'w').write(s)
          PY
          sed -n '/flutter_launcher_icons:/,$p' pubspec.yaml

      - run: flutter pub get

      - name: Ícone do app
        run: dart run flutter_launcher_icons

      - name: Compilar para iPhone (sem assinatura)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Empacotar o .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry manuook.ipa Payload
          ls -lh manuook.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: manuook-ipa
          path: manuook.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Manuook 1.0.${{ github.run_number }}
          files: |
            manuook.apk
            manuook.ipa
          body: |
            - **manuook.apk**: Android
            - **manuook.ipa**: iPhone (iOS 13 ou superior). Instale com o Sideloadly ou o AltStore, veja o README.

            Gerado a partir do commit ${{ github.sha }}.
